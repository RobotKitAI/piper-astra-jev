[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piper-astra-jev"
version = "0.1.0"
description = "LLM-driven demo runs on a real AgileX PiPER arm."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "httpx>=0.27", "pillow"]

[tool.hatch.build.targets.wheel]
packages = ["piper_llm"]

[tool.ruff]
line-length = 100
